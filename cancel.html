<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Platba zrušená</title>
    <style>
      :root { --bg:#DEEFF6; --primary:#0E68B1; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; padding:24px; background: var(--bg); color:#0b2540; }
      .card { max-width: 560px; margin: 8vh auto; background:#fff; border-radius:14px; padding:24px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 8px 0 0; line-height: 1.5; }
      .btn { display:inline-block; margin-top:16px; padding:10px 14px; background:var(--primary); color:#fff; text-decoration:none; border-radius:8px; }
      .muted { opacity:.7; font-size: 14px; }
    </style>
    <script>
      function tryDeepLink(){
        var url = 'matur://pay/result?status=canceled';
        location.href = url;
        setTimeout(function(){
          var b = document.getElementById('open');
          if (b) b.style.display = 'inline-block';
        }, 600);
      }
      window.addEventListener('DOMContentLoaded', tryDeepLink);
    </script>
  </head>
  <body>
    <div class="card">
      <h1>Platba zrušená</h1>
      <p>Vraciam vás do aplikácie…</p>
      <a id="open" href="#" class="btn" style="display:none" onclick="tryDeepLink();return false;">Otvoriť v aplikácii</a>
      <p class="muted">Ak sa aplikácia neotvorí automaticky, klepnite na tlačidlo vyššie.</p>
    </div>
  </body>
  </html>
